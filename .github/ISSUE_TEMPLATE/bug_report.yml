name: Bug report
description: Report a reproducible plex_scraper problem
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Redact API keys, tokens, private hostnames, LAN addresses and personal media paths before submitting.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v1.0.4 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Resolver
        - VFS
        - JIT / playback failover
        - Ingest / Arr bridge
        - Provider / TorBox / Torrentio
        - Cockpit / web UI
        - Deployment / Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / events
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private hostnames, LAN addresses and personal paths from the report.
          required: true
