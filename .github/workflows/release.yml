name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pyfuse3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run portable release gate
        run: pytest -q --ignore=tests/test_vfs_integration.py
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import plex_scraper
          print(plex_scraper.__version__)
          PY
          )"
          test "v$VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
