name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pyfuse3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run portable test suite
        run: pytest -q --ignore=tests/test_vfs_integration.py
      - name: Explain VFS integration scope
        run: |
          echo "tests/test_vfs_integration.py requires real privileged FUSE mount semantics."
          echo "It remains part of local/production preflight and is intentionally not run on GitHub-hosted runners."
