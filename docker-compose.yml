name: plex-scraper

services:
  resolver:
    build: .
    image: plex-scraper:local
    command: ["resolver"]
    env_file: .env
    environment:
      RESOLVER_BIND: 0.0.0.0:8282
    volumes:
      - ./config:/config:ro
      - /mnt/cache/appdata/plex-scraper/data:/data
    ports:
      # PoC: control API stays on localhost of the Unraid host.
      - "127.0.0.1:${RESOLVER_HOST_PORT:-8282}:8282"
    restart: unless-stopped

  vfs:
    image: plex-scraper:local
    build: .
    command: ["vfs"]
    env_file: .env
    environment:
      RESOLVER_URL: http://resolver:8282
    depends_on:
      - resolver
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      # Requires the host path to be on a *shared* mount (Unraid: /mnt/cache
      # is shared by default). The FUSE mount propagates from this container
      # to the host path, where Plex can bind it.
      - type: bind
        source: /mnt/cache/appdata/plex-scraper/vfs
        target: /mnt/plex-scraper
        bind:
          propagation: rshared
    restart: unless-stopped

  # Example: attach Plex read-only to the propagated mount.
  # Add to YOUR existing Plex container definition instead:
  #
  #   services:
  #     plex:
  #       volumes:
  #         - type: bind
  #           source: /mnt/cache/appdata/plex-scraper/vfs
  #           target: /media/plex-scraper
  #           read_only: true

  scraper:
    image: plex-scraper:local
    command: ["scraper"]
    env_file: .env
    environment:
      SCRAPER_BIND: 0.0.0.0:8283
    ports:
      - "127.0.0.1:18283:8283"
    restart: unless-stopped

  web:
    image: plex-scraper:local
    command: ["web"]
    environment:
      WEB_BIND: 0.0.0.0:8285
      RESOLVER_URL: http://resolver:8282
      MIG_DB: /state/migration-state.sqlite
    volumes:
      - /mnt/cache/appdata/plex-scraper/migration:/state:ro
      - /mnt/vm_storage/symlinks:/mnt/vm_storage/symlinks:ro
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:ro
      - /mnt/debrid:/mnt/debrid:ro
    ports:
      - "127.0.0.1:8285:8285"
    depends_on:
      - resolver
    restart: unless-stopped

