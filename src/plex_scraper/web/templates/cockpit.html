<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plex_scraper cockpit</title>
<style>
:root{
  --bg:#0a0c10; --surface-1:#11141a; --surface-2:#171b23; --surface-3:#1e2430;
  --border:#232a35; --border-strong:#303947;
  --text:#e6e9ef; --text-secondary:#aab2c0; --text-muted:#6d7684;
  --accent:#6ea8fe; --accent-dim:#2c3e5d;
  --success:#4cc38a; --warning:#e0a83c; --danger:#f26d6d;
  --radius:8px; --radius-sm:6px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);
  display:flex}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
/* ---------- sidebar ---------- */
#sidebar{width:190px;flex:0 0 190px;background:var(--surface-1);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
#sidebar .brand{padding:var(--sp-4);font-size:13px;font-weight:700;
  letter-spacing:.04em;color:var(--text-secondary);
  border-bottom:1px solid var(--border)}
#sidebar .brand b{color:var(--accent)}
#sidebar nav{padding:var(--sp-2);display:flex;flex-direction:column;gap:2px;flex:1}
#sidebar nav button{display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;color:var(--text-muted);padding:8px 10px;
  border-radius:var(--radius-sm);text-align:left}
#sidebar nav button:hover{background:var(--surface-2);color:var(--text-secondary)}
#sidebar nav button.on{background:var(--surface-3);color:var(--text);font-weight:600}
#sidebar nav button .ico{width:16px;text-align:center;opacity:.85}
#sidebar nav button .cnt{margin-left:auto;font-size:11px;color:var(--text-muted)}
#sidebar nav button.on .cnt{color:var(--text-secondary)}
#sidebar .foot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);
  font-size:11px;color:var(--text-muted)}
#sidebar .foot .row{display:flex;justify-content:space-between;margin-top:3px}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--success);margin-right:5px;vertical-align:1px}
.st-dot.warn{background:var(--warning)} .st-dot.err{background:var(--danger)}
.st-dot.off{background:var(--text-muted)}
/* ---------- main + topbar ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:var(--sp-3);padding:10px var(--sp-5);
  border-bottom:1px solid var(--border);background:var(--surface-1);
  position:sticky;top:0;z-index:5}
#pagetitle{font-size:15px;font-weight:700}
#pagesub{font-size:12px;color:var(--text-muted)}
#livewrap{margin-left:auto;display:flex;align-items:center;gap:var(--sp-3);
  font-size:12px;color:var(--text-muted)}
#livewrap .pill{border:1px solid var(--border);border-radius:20px;
  padding:2px 10px;display:flex;align-items:center;gap:6px}
main{padding:var(--sp-4) var(--sp-5);max-width:1280px;width:100%;margin:0 auto}
section{display:none}
section.on{display:block}
h2.sec{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-muted);margin:var(--sp-5) 0 var(--sp-2);font-weight:600}
/* ---------- banner ---------- */
.banner{padding:9px var(--sp-4);border-radius:var(--radius);margin:2px 0 var(--sp-4);
  border:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:13px;
  background:var(--surface-1)}
.banner.HEALTHY{border-color:color-mix(in srgb,var(--success) 35%,var(--border))}
.banner.HEALTHY .h{color:var(--success)}
.banner.DEGRADED,.banner.ATTENTION{border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}
.banner.DEGRADED .h,.banner.ATTENTION .h{color:var(--warning)}
.banner.ERROR{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
.banner.ERROR .h{color:var(--danger)}
/* ---------- system strip ---------- */
.strip{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.strip .cell{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px 11px;font-size:11.5px;
  color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.strip .cell b{color:var(--text);font-weight:600}
/* ---------- KPI ---------- */
.grid{display:grid;gap:var(--sp-3)}
.kpis{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px}
.kpi .l{font-size:11px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.kpi .n{font-size:21px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--text-secondary)}
.kpi.ok .n{color:var(--success)} .kpi.err .n{color:var(--danger)}
.kpi.warn .n{color:var(--warning)} .kpi.run .n{color:var(--run,#58a6fe)}
.cols{grid-template-columns:1fr 1fr}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
/* ---------- cards/panels ---------- */
.panel{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:11px 13px;margin-bottom:var(--sp-2)}
.panel h3{margin:0 0 3px;font-size:13px;font-weight:600}
.muted{color:var(--text-muted);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:5px;font-size:10.5px;
  font-weight:600;border:1px solid var(--border);color:var(--text-secondary);
  letter-spacing:.02em}
.b-SUCCESS,.b-READY,.b-RECOVERED,.b-COMPLETED,.b-KEPT,.b-HEALTHY{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.b-FAILED,.b-NO_SOURCE,.b-ERROR,.b-REJECTED{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.b-WARNING,.b-ATTENTION,.b-DEGRADED,.b-SUSPECT{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.b-RUNNING,.b-RESOLVING{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.b-RETRYING,.b-DEFERRED,.b-INTERRUPTED{color:var(--retry,#bc8cff);border-color:color-mix(in srgb,var(--retry,#bc8cff) 45%,transparent)}
.b-NO_MATCH,.b-neutral,.b-INFO,.b-BUSY,.b-Movie,.b-UNKNOWN{color:var(--text-muted)}
.b-TV{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
/* ---------- tables ---------- */
.tablewrap{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--text-muted);text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;padding:7px 10px;border-bottom:1px solid var(--border);
  font-weight:600;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
/* ---------- controls ---------- */
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:2px;gap:1px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--text-muted);padding:4px 11px;
  border-radius:4px;font-size:12px}
.seg button:hover{color:var(--text-secondary)}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600}
input[type=search],select{background:var(--surface-1);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;
  font:inherit;font-size:12.5px;min-width:160px;height:30px}
.progress{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;
  margin-top:4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .6s}
.empty{padding:26px;text-align:center;color:var(--text-muted)}
.empty .e-ico{font-size:18px;display:block;margin-bottom:6px}
.empty .e-title{display:block;color:var(--text-secondary);font-weight:600;margin-bottom:3px}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0}
.pager button{background:var(--surface-1);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 12px}
.bar{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.bar span{padding:1px 7px;border-radius:4px;font-size:10.5px;
  border:1px solid var(--border);color:var(--text-muted)}
.bar b{color:var(--text)}
/* ---------- buttons ---------- */
button.act{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:3px 10px;font-size:11.5px;font-weight:500}
button.act:hover{border-color:var(--accent);background:var(--surface-3)}
button.act:disabled{opacity:.4;cursor:default}
button.act.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border-strong))}
button.act.danger:hover{border-color:var(--danger)}
button.act.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.actmsg{font-size:12px;margin-top:4px}
.actmsg.SUCCESS{color:var(--success)} .actmsg.FAILED,.actmsg.REJECTED{color:var(--danger)}
.actmsg.RUNNING,.actmsg.BUSY{color:var(--accent)} .actmsg.KEPT,.actmsg.NO_MATCH{color:var(--warning)}
/* ---------- activity timeline ---------- */
.tl{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius)}
.tl-row{display:flex;gap:var(--sp-3);padding:8px 13px;border-bottom:1px solid var(--border);
  align-items:baseline}
.tl-row:last-child{border-bottom:0}
.tl-row:hover{background:var(--surface-2)}
.tl-time{color:var(--text-muted);font-size:11.5px;flex:0 0 42px;
  font-variant-numeric:tabular-nums}
.tl-ico{flex:0 0 14px;text-align:center;font-size:12px}
.tl-main{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:600}
.tl-title .cat{color:var(--text-muted);font-weight:500;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.tl-sub{font-size:12px;color:var(--text-secondary)}
.tl-right{flex:0 0 auto;text-align:right;font-size:11.5px;color:var(--text-muted)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--accent);font-size:12px}
/* ---------- issue rows ---------- */
.iss{display:flex;gap:var(--sp-3);align-items:flex-start;padding:10px 13px;
  border-bottom:1px solid var(--border);background:var(--surface-1)}
.iss:first-child{border-radius:var(--radius) var(--radius) 0 0}
.iss:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:0}
.iss-body{flex:1;min-width:0}
.iss-acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
/* ---------- modal / toast ---------- */
#itemdlg{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;
  overflow:auto;z-index:10}
#itemdlg .inner{background:var(--bg);max-width:980px;margin:24px auto;
  border:1px solid var(--border-strong);border-radius:10px;padding:var(--sp-4)}
#modal{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;z-index:20;
  align-items:center;justify-content:center}
#modal .box{background:var(--surface-1);border:1px solid var(--border-strong);
  border-radius:10px;padding:var(--sp-4);min-width:340px;max-width:480px}
#modal input,#modal select{width:100%;margin:6px 0 10px}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-3)}
#toasts{position:fixed;bottom:16px;right:16px;z-index:30;display:flex;
  flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--border-strong);
  border-left:3px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 13px;font-size:12.5px;max-width:380px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.SUCCESS{border-left-color:var(--success)}
.toast.FAILED,.toast.REJECTED,.toast.ERROR{border-left-color:var(--danger)}
.toast.KEPT,.toast.NO_MATCH{border-left-color:var(--warning)}
.chain{font-family:var(--mono);font-size:12px;line-height:1.9}
.chain .step{display:block;padding:2px 8px;border-left:2px solid var(--border)}
.chain .ok{border-color:var(--success)} .chain .bad{border-color:var(--danger)}
.arrow{color:var(--text-muted);padding-left:14px}
.matrix td:first-child{color:var(--text-secondary)}
/* ---------- responsive ---------- */
@media(max-width:860px){
  body{flex-direction:column}
  #sidebar{width:100%;flex:0 0 auto;height:auto;position:static;
    flex-direction:row;align-items:center;overflow-x:auto}
  #sidebar .brand{border-bottom:0;border-right:1px solid var(--border);white-space:nowrap}
  #sidebar nav{flex-direction:row;padding:var(--sp-1)}
  #sidebar nav button{width:auto;white-space:nowrap;padding:6px 9px}
  #sidebar nav button .cnt{margin-left:4px}
  #sidebar .foot{display:none}
  main{padding:var(--sp-3)}
  .kpis{grid-template-columns:1fr 1fr}
  .iss{flex-direction:column}
  .iss-acts{justify-content:flex-start;width:100%}
  .tl-row{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">plex_<b>scraper</b></div>
  <nav id="nav">
    <button data-s="overview" class="on" aria-label="Overview"><span class="ico">◈</span>Overview</button>
    <button data-s="activity" aria-label="Activity"><span class="ico">≡</span>Activity</button>
    <button data-s="issues" aria-label="Issues"><span class="ico">⚠</span>Issues<span class="cnt" id="nav-issues"></span></button>
    <button data-s="library" aria-label="Library"><span class="ico">▤</span>Library</button>
    <button data-s="ingest" aria-label="Ingest"><span class="ico">⇩</span>Ingest<span class="cnt" id="nav-ingest"></span></button>
    <button data-s="jobs" aria-label="Jobs"><span class="ico">◷</span>Jobs</button>
    <button data-s="providers" aria-label="Providers"><span class="ico">⛁</span>Providers</button>
  </nav>
  <div class="foot">
    <div class="row"><span><span class="st-dot" id="sb-phys"></span>Physical</span><span id="sb-phystxt">–</span></div>
    <div class="row"><span>Build</span><span class="num">local</span></div>
  </div>
</aside>
<div id="main">
<div id="topbar">
  <span id="pagetitle">Overview</span>
  <span id="pagesub"></span>
  <div id="livewrap" role="status" aria-live="polite">
    <span class="pill"><span class="st-dot" id="livedot"></span><span id="livetext">Live</span></span>
  </div>
</div>
<main>
<section id="s-overview" class="on">
  <div id="healthbanner" class="banner" aria-live="polite"><span class="muted">Loading…</span></div>
  <h2 class="sec">Library</h2><div id="kpilib" class="grid kpis"></div>
  <h2 class="sec">Automation &amp; providers</h2><div id="kpiauto" class="grid kpis"></div>
  <div class="grid cols" style="margin-top:var(--sp-4)">
    <div><h2 class="sec">Active now</h2><div id="nowactive"></div></div>
    <div><h2 class="sec">Recent automatic recoveries</h2><div id="wins"></div></div>
  </div>
  <h2 class="sec">Health sweeper</h2><div id="sweeperbox"></div>
</section>
<section id="s-activity">
  <div class="seg" id="actfilters" style="margin-bottom:var(--sp-3)">
    <button data-f="all" class="on">All</button>
    <button data-f="resolutions">Resolutions</button>
    <button data-f="repairs">Repairs</button>
    <button data-f="failovers">Failovers</button>
    <button data-f="sweeper">Sweeper</button>
    <button data-f="playback">Playback</button>
    <button data-f="provider">Provider</button>
    <button data-f="errors">Errors</button>
    <select id="acthours" aria-label="Time window" style="margin-left:6px"><option value="1">1h</option><option value="24" selected>24h</option><option value="168">7d</option></select>
  </div>
  <div id="activity"></div>
  <div class="pager"><button id="actprev" aria-label="Previous page">←</button><span id="actpage" class="muted num"></span><button id="actnext" aria-label="Next page">→</button></div>
</section>
<section id="s-issues"><div id="issues"></div></section>
<section id="s-library">
  <div class="filters" style="display:flex;gap:8px;align-items:center;margin-bottom:var(--sp-3);flex-wrap:wrap">
    <input id="libq" type="search" placeholder="Search title / series…" aria-label="Search">
    <select id="libstatus" aria-label="Filter">
      <option value="">All</option><option value="MOVIES">Movies</option>
      <option value="TV">TV episodes</option><option>READY</option>
      <option>NO_SOURCE</option><option>RESOLVING</option><option>SOURCE_FAILED</option>
      <option>PROVIDER_WAIT</option>
    </select>
    <span class="muted num" id="libcount"></span>
  </div>
  <div class="tablewrap"><table id="libtable"></table></div>
</section>
<section id="s-ingest"><div id="ingest"></div></section>
<section id="s-jobs"><div id="jobs"></div></section>
<section id="s-providers"><div id="providers"></div></section>
</main>
</div>
<div id="itemdlg" role="dialog" aria-modal="true"><div class="inner"><div id="itembody"></div>
<p style="text-align:right;margin-bottom:0"><a href="#" onclick="closeItem();return false">close</a></p></div></div>
<div id="modal"><div class="box"><div id="modalbody"></div>
<div class="row"><button class="act" onclick="closeModal()">Cancel</button>
<button class="act primary" id="modalok">Confirm</button></div></div></div>
<div id="toasts"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = ts => { const d = Math.round(Date.now()/1000 - ts);
  if (d < 60) return `${d}s ago`; if (d < 3600) return `${Math.round(d/60)}m ago`;
  if (d < 86400) return `${Math.round(d/3600)}h ago`; return `${Math.round(d/86400)}d ago`; };
const fmtIn = s => s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s/60)}m` : `${Math.round(s/3600)}h`;
const badge = (t,c)=>`<span class="badge b-${esc(c||t)}">${esc(t)}</span>`;
const NA = '<span class="muted">N/A</span>';
const DOT = (cls='')=>`<span class="st-dot ${cls}"></span>`;
let failures = 0;
const SHOT = new URLSearchParams(location.search).has('shot');
if (SHOT) window.fetch = path => {
  const x = new XMLHttpRequest(); x.open('GET', path, false); x.send();
  return {ok: x.status < 400, status: x.status,
          json: () => Promise.resolve(JSON.parse(x.responseText)),
          text: () => Promise.resolve(x.responseText)};
};
/* ---------- api + LKG ---------- */
const lastGood = {}; const inflight = {};
async function api(path){
  if (inflight[path]) throw new Error('busy');
  inflight[path] = true;
  try{
    const r = await fetch(path, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    lastGood[path] = {t: Date.now(), data};
    failures = 0; setLive(true);
    return data;
  } finally { delete inflight[path]; }
}
async function apiKeep(path, render){
  try{ render(await api(path)); markFresh(); }
  catch(e){
    if (e.message === 'busy') return;
    failures++; setLive(false);
    const lg = lastGood[path];
    if (lg) markStale(lg.t);
  }
}
let staleTick = null;
function markStale(t){
  if (staleTick) clearInterval(staleTick);
  const upd = ()=>{ $('#livetext').textContent = `Stale · ${Math.round((Date.now()-t)/1000)}s`; };
  upd(); staleTick = setInterval(upd, 1000);
}
function markFresh(){ if (staleTick){ clearInterval(staleTick); staleTick = null; } }
const rendered = {};
function paintInto(sel, key, html){
  if (rendered[key] === html) return;
  rendered[key] = html; $(sel).innerHTML = html;
}
const kpi = (label,n,cls='',sub='')=>`<div class="kpi ${cls}"><div class="l">${label}</div><div class="n">${n??'–'}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
const card = (t,sub,right)=>`<div class="panel"><h3>${t} <span style="float:right">${right||''}</span></h3><div>${sub||''}</div></div>`;
const empty = (title,sub)=>`<div class="empty"><span class="e-ico">✓</span><span class="e-title">${esc(title)}</span><br>${esc(sub||'')}</div>`;
const pct = j => j.progress_total ? Math.min(99, Math.round((j.progress_current||0)/j.progress_total*100)) : 0;
const REJHUMAN = {
  identity_wrong_show:'wrong series', identity_pack_missing_episode:'episode not in pack',
  identity_wrong_movie:'wrong movie', identity_wrong_year:'wrong year',
  pre_gate_size:'too small (pre-filtered)', budget_exhausted:'not tried (add budget used)',
  file_too_small:'file too small', torrent_no_files:'no files',

/* ---------- operator actions ---------- */
async function doAction(itemId, action, body){
  const r = await fetch(`/ops-post/media/${itemId}/actions/${action}`,
    {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
  return r.json();
}
async function runAction(ev, itemId, action, body, sel){
  const btn = ev && ev.target;
  if (btn) btn.disabled = true;
  if (sel) $(sel).innerHTML = `<div class="actmsg RUNNING">${badge('RUNNING')} Working…</div>`;
  try{
    const out = await doAction(itemId, action, body);
    toast(out.status||'RUNNING', out.message);
    if (sel) $(sel).innerHTML = `<div class="actmsg ${esc(out.status||'RUNNING')}">${badge(out.status||'RUNNING')} ${esc(out.message||'')}</div>`;
    lastPoll.overview = 0; lastPoll.issues = 0; lastPoll.jobs = 0; lastPoll.activity = 0;
    return out;
  } finally { if (btn) setTimeout(()=>btn.disabled=false, 1500); }
}

  };
  const recent = `<div class="panel"><h3>Catch-up policy</h3>
    <div class="muted">batch size <b class="num">${d.batch_size??1}</b> · reconcile every <b class="num">${Math.round((d.reconcile_interval_s||1200)/60)} min</b>
    ${d.last_reconcile_at?` · last reconcile ${ago(d.last_reconcile_at)}`:''}</div>
    <div class="muted" style="margin-top:4px">Provider 429 → queue pause + Retry-After/backoff. True no-match only after a normally completed search with zero usable candidates.</div></div>`;
  return banner + `<div class="grid kpis">${kpis}</div>${countsRow}
    <div class="grid cols" style="margin-top:var(--sp-3)">${arrCard('sonarr')}${arrCard('radarr')}</div>${recent}`;
}
/* ---------- item detail ---------- */
async function openItem(id){
  try{
    const t = await api(`/ops-media/${id}/trace`);
    const i = t.item;
    const ready = i.status === 'READY';
    const id8 = id.slice(0,8);
    const acts = ready
      ? `<button class="act" onclick="runAction(event,'${id}','recheck',null,'#idact-${id8}')">Recheck source</button>
         <button class="act" onclick="runAction(event,'${id}','find-alternative',null,'#idact-${id8}')">Find alternative</button>
         <button class="act danger" onclick="askMarkBad('${id}','#idact-${id8}')">Mark source bad</button>`
      : `<button class="act primary" onclick="runAction(event,'${id}','search',null,'#idact-${id8}')">Search now</button>
         <button class="act" onclick="runAction(event,'${id}','retry',null,'#idact-${id8}')">Retry now</button>
         <button class="act" onclick="askMagnet('${id}','#idact-${id8}')">Add magnet</button>`;
    const steps = [
      {l:'Plex mapping', v:i.plex_path, ok:!!i.plex_path},
      {l:'Resolver item', v:`${i.id.slice(0,8)} (gen ${i.generation})`, ok:true},
      {l:'Current source', v:t.active_source?`${t.active_source.file_name} · ${(t.active_source.size/2**30).toFixed(2)} GB`:'none', ok:!!t.active_source},
    ];
    const matrix = `
      <tr><td>Identity</td><td>${i.kind==='episode' ? (i.show_imdb_id?badge('Healthy','SUCCESS'):badge('Incomplete','WARNING')) : badge('Healthy','SUCCESS')}</td></tr>
      <tr><td>Source</td><td>${t.active_source?badge('Active','SUCCESS'):badge(i.status==='NO_SOURCE'?'No usable':'None', i.status==='NO_SOURCE'?'NO_SOURCE':'WARNING')}</td></tr>
      <tr><td>Path</td><td>${i.plex_path?badge('Configured','SUCCESS'):badge('Missing','FAILED')}</td></tr>
      <tr><td>Delivery</td><td>${badge('Not active','neutral')}</td></tr>`;
    const head = i.series
      ? `${esc(i.series)} <span class="muted">${esc(`S${String(i.season).padStart(2,'0')}E${String(i.episode).padStart(2,'0')}`)}</span> · ${esc(i.title||'')}`
      : `${esc(i.title||'')}${i.year?` <span class="muted">${i.year}</span>`:''}`;
    $('#itembody').innerHTML = `
      <h3 style="margin:0 0 6px;font-size:15px">${head} ${badge(i.status)} <span class="muted">gen ${i.generation}</span></h3>
      <div style="margin:8px 0">${acts}</div><div id="idact-${id8}"></div>
      <div class="grid cols">
        <div class="panel"><h3>Health matrix</h3><table class="matrix">${matrix}</table></div>
        <div class="panel"><h3>Path chain</h3><div class="chain">${steps.map(s=>
          `<span class="step ${s.ok?'ok':'bad'}">${s.ok?'✓':'✗'} ${s.l}: ${esc(s.v)}</span><span class="arrow">↓</span>`).join('')}
          <span class="step">provider (TorBox)</span></div>
          ${i.kind==='episode'?`<div class="muted" style="margin-top:6px">show <span class="mono">${esc(i.show_imdb_id||'–')}</span> · episode <span class="mono">${esc(i.imdb_id||'–')}</span></div>`:`<div class="muted" style="margin-top:6px">imdb <span class="mono">${esc(i.imdb_id||'–')}</span></div>`}</div>
      </div>
      <h2 class="sec">Candidate trace — last resolve</h2>
      ${t.last_resolve.candidate_count!=null?`<div class="muted">${t.last_resolve.candidate_count} candidates · ${t.last_resolve.provider_adds??0} provider adds</div>${rejectBar(t.last_resolve.rejects||{})}`:''}
      <div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Candidate</th><th>Outcome</th></tr></thead><tbody>
      ${t.last_resolve.candidates.map((c,n)=>`<tr><td class="num">${n+1}</td><td class="mono" style="max-width:420px;overflow:hidden;text-overflow:ellipsis">${esc(c.name||c.hash||'?')}</td>
        <td>${c.result==='SELECTED'?badge('SELECTED','SUCCESS'):`<span class="muted">${esc(c.human||c.result)}</span>${c.error?`<div class="muted">${esc(c.error)}</div>`:''}`}</td></tr>`).join('')}</tbody></table></div>
      <details style="margin-top:10px"><summary>Technical timeline</summary><div class="chain">${t.timeline.slice(-25).reverse().map(e=>
        `<span class="step">${new Date(e.ts*1000).toLocaleTimeString()} · ${esc(e.kind)}</span>`).join('')}</div></details>`;
    $('#itemdlg').style.display='block';
  }catch(e){ failures++; setLive(false); }
}
function closeItem(){ $('#itemdlg').style.display='none'; }
function setLive(on){
  $('#livedot').className = 'st-dot' + (on?'':' warn');
  if (on && !staleTick) $('#livetext').textContent = 'Live';
}
function refresh(sec){
  if(sec==='overview') apiKeep('/ops/dashboard', d=>{
    const h = overviewHtml(d);
    paintInto('#healthbanner','hb',h.banner); paintInto('#kpilib','kl',h.kpilib);
    paintInto('#kpiauto','ka',h.kpiauto); paintInto('#nowactive','na',h.now);
    paintInto('#wins','wi',h.wins); paintInto('#sweeperbox','sw',h.sweeper);
    const P = d.physical||{};
    $('#sb-phys').className = 'st-dot' + (P.status==='HEALTHY'?'':P.status==='FAILED'?' err':' warn');
    $('#sb-phystxt').textContent = P.status||'–';
  });
  if(sec==='issues') apiKeep('/ops/issues', d=>{
    paintInto('#issues','iss', issuesHtml(d));
    $('#nav-issues').textContent = d.total || '';
  });
  if(sec==='jobs') apiKeep('/ops/jobs', d=>paintInto('#jobs','jobs', jobsHtml(d)));
  if(sec==='providers') apiKeep('/ops/providers/health', d=>paintInto('#providers','prov', providersHtml(d)));
  if(sec==='ingest') apiKeep('/ops/ingest/health', d=>{
    paintInto('#ingest','ingest', ingestHtml(d));
    const c = d.counts_by_state||{};
    const active = (c.QUEUED||0)+(c.RESOLVING||0)+(c.PROVIDER_WAIT||0)+(c.DELIVERING||0);
    $('#nav-ingest').textContent = active || '';
  });
  if(sec==='library') loadLibrary();
}
const cadence = {overview:5000, issues:8000, activity:15000, jobs:5000, providers:30000, library:30000, ingest:8000};
const lastPoll = {};
function loop(sec){
  const now = Date.now();
  if (now - (lastPoll[sec]||0) < cadence[sec]) return;
  lastPoll[sec] = now; refresh(sec);
}
function onShown(sec){
  lastPoll[sec]=0; loop(sec);
  const titles = {overview:['Overview','system health at a glance'],activity:['Activity','event timeline'],
    issues:['Issues','triage queue'],library:['Library','all managed items'],
    ingest:['Ingest','sonarr/radarr wanted → library pipeline'],
    jobs:['Jobs','background operations'],providers:['Providers','debrid provider health']};
  $('#pagetitle').textContent = titles[sec][0];
  $('#pagesub').textContent = titles[sec][1];
}
function loadActivity(){
  apiKeep(`/ops/activity?hours=${$('#acthours').value}&filter=${actFilter}&limit=15&offset=${actPage*15}`,
    d=>{ $('#actpage').textContent = `${actPage*15+1}–${Math.min((actPage+1)*15,d.total)} of ${d.total}`;
         paintInto('#activity','act', activityHtml(d)); });
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#s-'+b.dataset.s).classList.add('on');
  history.replaceState(null, '', '#'+b.dataset.s);
  onShown(b.dataset.s);
});
document.querySelectorAll('#actfilters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#actfilters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); actFilter=b.dataset.f; actPage=0;
  history.replaceState(null, '', `#activity/${actFilter}`);
  loadActivity();
});
$('#acthours').onchange = ()=>{ actPage=0; loadActivity(); };
$('#actprev').onclick = ()=>{ if(actPage>0){actPage--;loadActivity();} };
$('#actnext').onclick = ()=>{ actPage++; loadActivity(); };
$('#libq').oninput = renderLibrary; $('#libstatus').onchange = renderLibrary;
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden) for (const s of ['overview','issues','jobs','activity','library']) lastPoll[s]=0;
});
setInterval(()=>{
  if (document.hidden) return;
  const sec = document.querySelector('section.on').id.replace('s-','');
  loop(sec);
  if (sec==='overview'){ loop('issues'); loop('jobs'); loop('ingest'); }
  if (sec==='activity') loop('activity');
}, 2000);
function applyHash(){
  const h = location.hash.replace('#','');
  if (h.startsWith('item/')){ openItem(h.slice(5)); return; }
  if (h.startsWith('activity/')){
    document.querySelector('#nav button[data-s="activity"]').click();
    const fb = document.querySelector(`#actfilters button[data-f="${h.split('/')[1]}"]`);
    if (fb) fb.click();
    return;
  }
  const b = document.querySelector(`#nav button[data-s="${h}"]`);
  if (b) b.click();
}
onShown('overview'); loadLibrary();
applyHash();
</script>
</body>
</html>
