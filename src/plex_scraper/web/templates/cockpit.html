<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plex_scraper cockpit</title>
<style>
:root{
  --bg:#0b0d12; --surface-1:#12151d; --surface-2:#171b25; --surface-3:#1d2430;
  --hairline:#1d232e; --hairline-strong:#29303e;
  --text:#e8ebf1; --text-secondary:#a8b0c0; --text-muted:#6b7484;
  --accent:#6ea8fe; --accent-dim:#2c3e5d;
  --success:#4cc38a; --warning:#e0a83c; --danger:#f26d6d; --retry:#bc8cff;
  --radius:12px; --radius-sm:8px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font);
  display:flex}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
/* ---------- sidebar ---------- */
#sidebar{width:196px;flex:0 0 196px;background:transparent;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
#sidebar .brand{padding:20px var(--sp-4) 14px;font-size:13px;font-weight:700;
  letter-spacing:.04em;color:var(--text-secondary)}
#sidebar .brand b{color:var(--accent)}
#sidebar nav{padding:0 var(--sp-2);display:flex;flex-direction:column;gap:1px;flex:1}
#sidebar nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;color:var(--text-muted);padding:8px 12px;
  border-radius:var(--radius-sm);text-align:left;font-size:13.5px}
#sidebar nav button:hover{background:var(--surface-1);color:var(--text-secondary)}
#sidebar nav button.on{background:var(--surface-1);color:var(--text);font-weight:600}
#sidebar nav button.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;
  width:2px;border-radius:2px;background:var(--accent)}
#sidebar nav button .ico{width:18px;text-align:center;font-size:13px;opacity:.9}
#sidebar nav button .cnt{margin-left:auto;font-size:10.5px;line-height:1;
  color:var(--text-secondary);background:var(--surface-2);border-radius:9px;
  padding:3px 7px;font-variant-numeric:tabular-nums}
#sidebar nav button.on .cnt{color:var(--text);background:var(--surface-3)}
#sidebar .foot{padding:var(--sp-3) var(--sp-4);font-size:11px;color:var(--text-muted)}
#sidebar .foot .row{display:flex;justify-content:space-between;margin-top:3px}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--success);margin-right:2px;flex:0 0 auto}
.st-dot.warn{background:var(--warning)} .st-dot.err{background:var(--danger)}
.st-dot.off{background:var(--text-muted)}
/* ---------- main + topbar ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--surface-1) 0,var(--bg) 240px)}
#topbar{display:flex;align-items:baseline;gap:var(--sp-3);padding:18px var(--sp-6) 14px;
  position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(6px)}
#pagetitle{font-size:17px;font-weight:700}
#pagesub{font-size:12.5px;color:var(--text-muted)}
#livewrap{margin-left:auto;display:flex;align-items:center;gap:var(--sp-3);
  font-size:12px;color:var(--text-muted)}
#livewrap .pill{border:1px solid var(--hairline-strong);border-radius:20px;
  padding:3px 11px;display:flex;align-items:center;gap:6px;background:var(--surface-1)}
main{padding:var(--sp-2) var(--sp-6) var(--sp-6);max-width:1240px;width:100%;margin:0 auto}
section{display:none}
section.on{display:block}
h2.sec{font-size:12.5px;font-weight:600;letter-spacing:.01em;
  color:var(--text-muted);margin:var(--sp-5) 0 var(--sp-2)}
/* ---------- status line / banners ---------- */
.statusline{display:flex;align-items:center;gap:9px;font-size:13.5px;
  padding:2px 0;flex-wrap:wrap}
.statusline .cause{color:var(--text-muted);font-weight:400}
.banner{padding:10px 14px;border-radius:var(--radius);margin:0 0 var(--sp-4);
  display:flex;align-items:center;gap:10px;font-size:13px;
  background:var(--surface-1);border:1px solid var(--hairline-strong)}
.banner .cause{color:var(--text-muted);font-weight:400}
.banner.HEALTHY{border-color:color-mix(in srgb,var(--success) 30%,transparent)}
.banner.HEALTHY .h{color:var(--success)}
.banner.DEGRADED,.banner.ATTENTION,.banner.WARNING{
  border-color:color-mix(in srgb,var(--warning) 38%,transparent)}
.banner.DEGRADED .h,.banner.ATTENTION .h,.banner.WARNING .h{color:var(--warning)}
.banner.ERROR{border-color:color-mix(in srgb,var(--danger) 38%,transparent)}
.banner.ERROR .h{color:var(--danger)}
/* ---------- library health cluster ---------- */
.hc{background:var(--surface-1);border-radius:var(--radius);padding:18px 20px 16px}
.hc-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hc-title{font-size:14px;font-weight:650;color:var(--text-secondary)}
.hc-pct{font-size:27px;font-weight:700;margin-left:10px;color:var(--text)}
.hc-sub{font-size:12px;color:var(--text-muted)}
.hc-bar{display:flex;gap:3px;height:8px;border-radius:5px;overflow:hidden;
  margin:13px 0 15px;background:var(--surface-3)}
.hc-bar span{display:block;height:100%;min-width:3px;border-radius:2px;
  transition:width .6s}
.hc-bar .s-ok{background:var(--success)} .hc-bar .s-warn{background:var(--warning)}
.hc-bar .s-err{background:var(--danger)}
.hc-stats{display:flex;gap:34px;flex-wrap:wrap}
.hc-stat{background:none;border:0;padding:0;text-align:left;color:var(--text-secondary);
  font:inherit;font-size:13px;display:flex;align-items:baseline;gap:8px;border-radius:4px}
.hc-stat b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.hc-stat.ok b{color:var(--success)} .hc-stat.err b{color:var(--danger)}
.hc-stat.warn b{color:var(--warning)}
.hc-stat:hover{color:var(--text)}
.hc-stat:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hairline-strong)}
/* ---------- stat strip ---------- */
.statstrip{display:flex;flex-wrap:wrap;background:var(--surface-1);
  border-radius:var(--radius);padding:4px 6px}
.stat{display:flex;align-items:baseline;gap:9px;padding:11px 18px;flex:1 1 auto;min-width:158px}
.stat+.stat{border-left:1px solid var(--hairline)}
.stat .s-l{font-size:12.5px;color:var(--text-secondary)}
.stat b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s-s{font-size:11px;color:var(--text-muted)}
/* ---------- active job / idle lines ---------- */
.idleline{font-size:13px;color:var(--text-muted);padding:10px 2px}
.jobcard{background:var(--surface-1);border-radius:var(--radius);padding:14px 18px 15px;
  margin-bottom:var(--sp-2)}
.jc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:9px}
.jc-name{font-size:14px;font-weight:650}
.jc-item{color:var(--text-muted);font-weight:400;font-size:12.5px}
.jc-meta{display:flex;gap:16px;font-size:12px;color:var(--text-secondary);margin-top:7px;flex-wrap:wrap}
/* ---------- win rows / diagnostics ---------- */
.winlist,.diaglist{background:var(--surface-1);border-radius:var(--radius);overflow:hidden}
.winrow{display:flex;align-items:center;gap:12px;padding:10px 18px;
  border-bottom:1px solid var(--hairline)}
.winrow:last-child{border-bottom:0}
.w-label{font-size:13.5px;font-weight:600}
.w-main{flex:1;min-width:0}
.w-sub{font-size:12px;color:var(--text-muted);display:block;margin-top:1px}
.w-file{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:inline-block;vertical-align:bottom}
.w-right{margin-left:auto;display:flex;align-items:center;gap:9px;white-space:nowrap;
  font-size:12px;color:var(--text-muted)}
.dg-row{display:flex;align-items:baseline;gap:10px;padding:9px 18px;
  border-bottom:1px solid var(--hairline);font-size:12.5px;flex-wrap:wrap}
.dg-row:last-child{border-bottom:0}
.dg-name{color:var(--text-muted);flex:0 0 128px}
.dg-val{color:var(--text);font-weight:600;display:inline-flex;align-items:center}
.dg-sub{color:var(--text-muted);font-size:11.5px}
/* ---------- KPI (providers/ingest detail) ---------- */
.grid{display:grid;gap:var(--sp-3)}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--surface-1);border-radius:var(--radius-sm);padding:10px 13px}
.kpi .l{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.kpi .n{font-size:19px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--text-muted)}
.kpi.ok .n{color:var(--success)} .kpi.err .n{color:var(--danger)}
.kpi.warn .n{color:var(--warning)} .kpi.run .n{color:var(--accent)}
.cols{grid-template-columns:1fr 1fr}
.ovgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--sp-6);align-items:start}
@media(max-width:1000px){.ovgrid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
/* ---------- panels ---------- */
.panel{background:var(--surface-1);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:var(--sp-2)}
.panel h3{margin:0 0 3px;font-size:13px;font-weight:600}
.muted{color:var(--text-muted);font-size:12px}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;
  font-size:10px;font-weight:600;letter-spacing:.03em;
  border:1px solid var(--hairline-strong);color:var(--text-secondary);white-space:nowrap}
.b-SUCCESS,.b-READY,.b-RECOVERED,.b-COMPLETED,.b-KEPT,.b-HEALTHY{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent)}
.b-FAILED,.b-NO_SOURCE,.b-ERROR,.b-REJECTED{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.b-WARNING,.b-ATTENTION,.b-DEGRADED,.b-SUSPECT{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,transparent)}
.b-RUNNING,.b-RESOLVING{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.b-RETRYING,.b-DEFERRED,.b-INTERRUPTED{color:var(--retry);border-color:color-mix(in srgb,var(--retry) 40%,transparent)}
.b-NO_MATCH,.b-neutral,.b-INFO,.b-BUSY,.b-Movie,.b-UNKNOWN{color:var(--text-muted)}
.b-TV{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-right:6px;flex:0 0 auto;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* ---------- tables ---------- */
.tablewrap{background:var(--surface-1);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--text-muted);text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;padding:9px 12px;border-bottom:1px solid var(--hairline-strong);
  font-weight:600;white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--hairline);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(110,168,254,.04)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
/* ---------- controls ---------- */
.seg{display:inline-flex;background:var(--surface-1);border-radius:var(--radius-sm);
  padding:2px;gap:1px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--text-muted);padding:4px 11px;
  border-radius:6px;font-size:12px}
.seg button:hover{color:var(--text-secondary)}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600}
input[type=search],select{background:var(--surface-1);color:var(--text);
  border:1px solid var(--hairline-strong);border-radius:var(--radius-sm);padding:5px 10px;
  font:inherit;font-size:12.5px;min-width:160px;height:30px}
.progress{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .6s}
.empty{padding:30px;text-align:center;color:var(--text-muted)}
.empty .e-ico{font-size:18px;display:block;margin-bottom:6px}
.empty .e-title{display:block;color:var(--text-secondary);font-weight:600;margin-bottom:3px}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0}
.pager button{background:var(--surface-1);color:var(--text);
  border:1px solid var(--hairline-strong);border-radius:var(--radius-sm);padding:4px 12px}
.bar{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.bar span{padding:1px 7px;border-radius:4px;font-size:10.5px;
  border:1px solid var(--hairline);color:var(--text-muted)}
.bar b{color:var(--text)}
/* ---------- buttons ---------- */
button.act{background:var(--surface-2);color:var(--text);border:1px solid var(--hairline-strong);
  border-radius:var(--radius-sm);padding:3px 10px;font-size:11.5px;font-weight:500}
button.act:hover{border-color:var(--accent);background:var(--surface-3)}
button.act:disabled{opacity:.4;cursor:default}
button.act.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--hairline-strong))}
button.act.danger:hover{border-color:var(--danger)}
button.act.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.actmsg{font-size:12px;margin-top:4px}
.actmsg.SUCCESS{color:var(--success)} .actmsg.FAILED,.actmsg.REJECTED{color:var(--danger)}
.actmsg.RUNNING,.actmsg.BUSY{color:var(--accent)} .actmsg.KEPT,.actmsg.NO_MATCH{color:var(--warning)}
/* ---------- activity timeline ---------- */
.tl{background:var(--surface-1);border-radius:var(--radius);overflow:hidden}
.tl-row{display:flex;gap:var(--sp-3);padding:9px 16px;border-bottom:1px solid var(--hairline);
  align-items:baseline}
.tl-row:last-child{border-bottom:0}
.tl-row:hover{background:rgba(110,168,254,.04)}
.tl-time{color:var(--text-muted);font-size:11.5px;flex:0 0 42px;
  font-variant-numeric:tabular-nums}
.tl-ico{flex:0 0 14px;text-align:center;font-size:12px}
.tl-main{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:600}
.tl-title .cat{color:var(--text-muted);font-weight:500;font-size:11px;
  margin-right:6px}
.tl-sub{font-size:12px;color:var(--text-secondary)}
.tl-right{flex:0 0 auto;text-align:right;font-size:11.5px;color:var(--text-muted)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--accent);font-size:12px}
/* ---------- issue rows ---------- */
.iss{display:flex;gap:var(--sp-3);align-items:flex-start;padding:11px 16px;
  border-bottom:1px solid var(--hairline);background:var(--surface-1)}
.iss:first-child{border-radius:var(--radius) var(--radius) 0 0}
.iss:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:0}
.iss-body{flex:1;min-width:0}
.iss-acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
/* ---------- modal / toast ---------- */
#itemdlg{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;
  overflow:auto;z-index:10}
#itemdlg .inner{background:var(--bg);max-width:980px;margin:24px auto;
  border:1px solid var(--hairline-strong);border-radius:10px;padding:var(--sp-4)}
#modal{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;z-index:20;
  align-items:center;justify-content:center}
#modal .box{background:var(--surface-1);border:1px solid var(--hairline-strong);
  border-radius:10px;padding:var(--sp-4);min-width:340px;max-width:480px}
#modal input,#modal select{width:100%;margin:6px 0 10px}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-3)}
#toasts{position:fixed;bottom:16px;right:16px;z-index:30;display:flex;
  flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--hairline-strong);
  border-left:3px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 13px;font-size:12.5px;max-width:380px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.SUCCESS{border-left-color:var(--success)}
.toast.FAILED,.toast.REJECTED,.toast.ERROR{border-left-color:var(--danger)}
.toast.KEPT,.toast.NO_MATCH{border-left-color:var(--warning)}
.chain{font-family:var(--mono);font-size:12px;line-height:1.9}
.chain .step{display:block;padding:2px 8px;border-left:2px solid var(--hairline-strong)}
.chain .ok{border-color:var(--success)} .chain .bad{border-color:var(--danger)}
.arrow{color:var(--text-muted);padding-left:14px}
.matrix td:first-child{color:var(--text-secondary)}
/* ---------- responsive ---------- */
@media(max-width:860px){
  body{flex-direction:column}
  #sidebar{width:100%;flex:0 0 auto;height:auto;position:static;
    flex-direction:row;align-items:center;overflow-x:auto}
  #sidebar .brand{white-space:nowrap;padding:12px var(--sp-3)}
  #sidebar nav{flex-direction:row;padding:var(--sp-1)}
  #sidebar nav button{width:auto;white-space:nowrap;padding:6px 9px}
  #sidebar nav button.on::before{display:none}
  #sidebar nav button .cnt{margin-left:4px}
  #sidebar .foot{display:none}
  #topbar{padding:14px var(--sp-3) 10px}
  main{padding:var(--sp-1) var(--sp-3) var(--sp-4)}
  .iss{flex-direction:column}
  .iss-acts{justify-content:flex-start;width:100%}
  .tl-row{flex-wrap:wrap}
  .hc{padding:14px 16px 13px}
  .hc-stats{gap:20px}
  .stat{min-width:140px;padding:9px 13px}
  .stat+.stat{border-left:0}
  .w-file{max-width:180px}
}
@media(prefers-reduced-motion:reduce){
  .progress i{transition:none}.pulse{animation:none}}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">plex_<b>scraper</b></div>
  <nav id="nav">
    <button data-s="overview" class="on" aria-label="Overview"><span class="ico">◈</span>Overview</button>
    <button data-s="activity" aria-label="Activity"><span class="ico">≡</span>Activity</button>
    <button data-s="issues" aria-label="Issues"><span class="ico">⚠</span>Issues<span class="cnt" id="nav-issues"></span></button>
    <button data-s="library" aria-label="Library"><span class="ico">▤</span>Library</button>
    <button data-s="ingest" aria-label="Ingest"><span class="ico">⇩</span>Ingest<span class="cnt" id="nav-ingest"></span></button>
    <button data-s="jobs" aria-label="Jobs"><span class="ico">◷</span>Jobs</button>
    <button data-s="providers" aria-label="Providers"><span class="ico">⛁</span>Providers</button>
  </nav>
  <div class="foot">
    <div class="row"><span><span class="st-dot" id="sb-phys"></span>Physical</span><span id="sb-phystxt">–</span></div>
    <div class="row"><span>Build</span><span class="num">local</span></div>
  </div>
</aside>
<div id="main">
<div id="topbar">
  <span id="pagetitle">Overview</span>
  <span id="pagesub"></span>
  <div id="livewrap" role="status" aria-live="polite">
    <span class="pill"><span class="st-dot" id="livedot"></span><span id="livetext">Live</span></span>
  </div>
</div>
<main>
<section id="s-overview" class="on">
  <div id="healthbanner" aria-live="polite"><div class="statusline"><span class="muted">Loading…</span></div></div>
  <h2 class="sec">Library health</h2>
  <div id="healthcluster"></div>
  <h2 class="sec">Automation</h2>
  <div id="statstrip"></div>
  <div class="ovgrid">
    <div><h2 class="sec">Active now</h2><div id="nowactive"></div></div>
    <div><h2 class="sec">Recent automatic recoveries</h2><div id="wins"></div></div>
  </div>
  <h2 class="sec">Diagnostics</h2>
  <div id="diagnostics"></div>
</section>
<section id="s-activity">
  <div class="seg" id="actfilters" style="margin-bottom:var(--sp-3)">
    <button data-f="all" class="on">All</button>
    <button data-f="resolutions">Resolutions</button>
    <button data-f="repairs">Repairs</button>
    <button data-f="failovers">Failovers</button>
    <button data-f="sweeper">Sweeper</button>
    <button data-f="playback">Playback</button>
    <button data-f="provider">Provider</button>
    <button data-f="errors">Errors</button>
    <select id="acthours" aria-label="Time window" style="margin-left:6px"><option value="1">1h</option><option value="24" selected>24h</option><option value="168">7d</option></select>
  </div>
  <div id="activity"></div>

const $ = s => document.querySelector(s);

const fmtIn = s => s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s/60)}m` : `${Math.round(s/3600)}h`;
/* UI-FMT-BEGIN — pure time/number formatters, node-getest (audit 2026-10-07).
   Eén centrale relatieve-tijd-formatter: accepteert epoch-s, epoch-ms, ISO of
   een duur in seconden; plakt 'ago' exact één keer achter het label; ongeldige
   of absurde leeftijden ("20733d") → 'timestamp unavailable'.
   Houd dit blok dependency-free (hierbatim geëxtraheerd door de tests). */
const UI_MAX_AGE_S = 10 * 365.25 * 86400;
function parseTs(v){
  if (v === null || v === undefined || v === '' || typeof v === 'boolean') return null;
  let t;
  if (typeof v === 'number') t = v;
  else if (typeof v === 'string'){
    const s = v.trim(); if (!s) return null;
    if (/^-?\d+(\.\d+)?$/.test(s)) t = parseFloat(s);
    else { const p = Date.parse(s); if (Number.isNaN(p)) return null; t = p / 1000; }
  } else return null;
  if (!Number.isFinite(t)) return null;
  if (t > 1e11) t /= 1000;                       // milliseconden → seconden
  if (t <= 0) return null;
  return t;
}
function ageSeconds(v, nowSec){
  const t = parseTs(v); if (t === null) return null;
  const a = (nowSec ?? Date.now() / 1000) - t;
  if (a < -90 || a > UI_MAX_AGE_S) return null;  // toekomst-skew / absurde leeftijd
  return Math.max(0, a);
}
function fmtAgeLabel(a){
  if (a === null || a === undefined || !Number.isFinite(a) || a < 0
      || a > UI_MAX_AGE_S) return 'timestamp unavailable';
  if (a < 60) return `${Math.max(1, Math.round(a))}s ago`;
  if (a < 3600) return `${Math.round(a / 60)} min ago`;
  if (a < 48 * 3600) return `${Math.round(a / 3600)}h ago`;
  return `${Math.round(a / 86400)}d ago`;
}
function fmtAgo(v, nowSec){ return fmtAgeLabel(ageSeconds(v, nowSec)); }
function fmtDur(s){
  if (s === null || s === undefined || !Number.isFinite(s) || s < 0) return '–';
  s = Math.round(s);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), sec = s % 60;
  if (m < 60) return sec ? `${m}m ${sec}s` : `${m}m`;
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return mm ? `${h}h ${mm}m` : `${h}h`;
  const d = Math.floor(h / 24), hh = h % 24;
  return hh ? `${d}d ${hh}h` : `${d}d`;
}
function fmtNum(n){
  if (n === null || n === undefined || !Number.isFinite(Number(n))) return '–';
  return Number(n).toLocaleString('en-US');
}
/* UI-FMT-END */
const badge = (t,c)=>`<span class="badge b-${esc(c||t)}">${esc(t)}</span>`;

/* ---------- api + LKG ---------- */
const lastGood = {}; const inflight = {};
async function api(path){
  if (inflight[path]) throw new Error('busy');
  inflight[path] = true;
  try{
    const r = await fetch(path, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    lastGood[path] = {t: Date.now(), data};
    failures = 0; setLive(true);
    return data;
  } finally { delete inflight[path]; }
}
async function apiKeep(path, render){
  try{ render(await api(path)); markFresh(); }
  catch(e){
    if (e.message === 'busy') return;
    failures++; setLive(false);
    const lg = lastGood[path];
    if (lg) markStale(lg.t);
  }
}

function overviewHtml(d){

  const pend = (L.pending != null) ? L.pending : Math.max(0, total - ready - issues);
  const HLABEL = {HEALTHY:'System healthy', DEGRADED:'Degraded', ATTENTION:'Attention',

    const file = w.file ? String(w.file) : '';

async function loadLibrary(){
  await apiKeep('/media-items', items=>{
    libCache = Array.isArray(items) ? items : items.items || [];
    renderLibrary();
  });
}
function rowLabel(i){
  if (i.kind === 'episode'){
    const se = (Number.isInteger(i.season) && Number.isInteger(i.episode))
      ? `S${String(i.season).padStart(2,'0')}E${String(i.episode).padStart(2,'0')}` : null;
    return {main: i.series || 'Unknown series',
            sub: se ? `${se}${i.title?` · ${i.title}`:''}` : 'Episode metadata incomplete'};
  }
  if (i.kind === 'movie') return {main: i.title || 'Unknown movie', sub: i.year ? String(i.year) : ''};
  return {main: i.title || i.series || 'Unknown', sub: 'Unknown type'};
}
function identityLabel(i){
  if (i.kind === 'episode')
    return i.show_imdb_id ? badge('TV','TV') : badge('incomplete','WARNING');
  if (i.kind === 'movie') return badge('Movie','neutral');
  return badge('Unknown','neutral');
}
function renderLibrary(){
  const q = ($('#libq').value||'').toLowerCase();
  const st = $('#libstatus').value;
  const rows = libCache.filter(i =>
    (!st || i.status===st || (st==='MOVIES' && i.kind==='movie') || (st==='TV' && i.kind==='episode')) &&
    (!q || (i.title||'').toLowerCase().includes(q) || (i.series||'').toLowerCase().includes(q)));
  const html = `<thead><tr><th>Media</th><th>Type</th><th>State</th><th>Identity</th><th class="num">Gen</th><th>Actions</th></tr></thead><tbody>` +
    rows.slice(0,150).map(i=>{
      const id = i.id;
      const ready = i.status === 'READY';
      const L = rowLabel(i);
      const acts = ready
        ? `<button class="act" onclick="runAction(event,'${id}','recheck',null)">Recheck</button>
           <button class="act" onclick="runAction(event,'${id}','find-alternative',null)">Find another source</button>
           <button class="act danger" onclick="askMarkBad('${id}')">Mark bad</button>`
        : `<button class="act primary" onclick="runAction(event,'${id}','search',null)">Search now</button>
           <button class="act" onclick="runAction(event,'${id}','retry',null)">Retry</button>`;
      return `<tr>
      <td><div>${esc(L.main)}</div><div class="muted">${esc(L.sub)}</div></td>
      <td>${identityLabel(i)}</td>
      <td>${badge((i.status||'UNKNOWN').replace('_',' '))}</td>
      <td>${i.kind==='episode'?(i.show_imdb_id?badge('complete','SUCCESS'):badge('incomplete','WARNING')):badge('ok','SUCCESS')}</td>
      <td class="num">${i.generation??0}</td>
      <td style="min-width:250px;white-space:nowrap">${acts}
        <button class="act" onclick="openItem('${id}')">Trace</button>
        <div id="am-${id.slice(0,8)}"></div></td></tr>`;}).join('') + `</tbody>`;
  paintInto('#libtable','libtbl',html);
  $('#libcount').textContent = `${rows.length} of ${libCache.length}`;
}
/* ---------- jobs ---------- */
function stateBadge(state){
  if (state === 'RUNNING') return runBadge();
  if (state === 'SUCCESS') return badge('COMPLETED','COMPLETED');
  return badge(state, state);
}
function jobsHtml(d){
  if (!d.jobs.length && !(d.history||[]).length)
    return empty('No jobs yet','Health sweeps appear here while they run.');
  const row = j=>{
    const st = j.state;
    const eligible = j.progress_total!=null && j.progress_total===0 && j.state!=='RUNNING';
    const total = j.progress_total;
    const cur = Math.max(0, j.progress_current ?? j.processed ?? 0);
    const prog = eligible ? '<span class="muted">0 items eligible</span>'
      : (j.state==='RUNNING' && total)
        ? `<div class="progress"><i style="width:${Math.min(100,Math.round(cur/total*100))}%"></i></div><span class="muted num">${fmtNum(cur)} / ${fmtNum(total)}${j.current_item?` · ${esc(j.current_item)}`:''}</span>`
        : '–';
    return `<tr><td>${esc(jobName(j.job_type))}<div class="muted">${fmtAgo(j.last_run)}</div></td>
      <td>${stateBadge(st)}</td><td style="min-width:170px">${prog}</td>
      <td class="num">${j.processed??'–'}</td><td class="num">${j.changed??0}</td><td class="num">${j.recovered??0}</td></tr>`; };
  const hrow = h=>{
    // live elapsed alleen voor écht draaiende runs; terminal states zonder
    // finished_at (bijv. INTERRUPTED bij restart) tonen geen nep-timer
    const dur = h.finished_at ? fmtDur(h.finished_at - h.started_at)
      : h.status === 'RUNNING'
        ? `<span data-elapsed="${h.started_at}">${fmtDur(Math.max(0, Date.now()/1000 - h.started_at))}</span>`
        : '–';
    return `<tr><td>${esc(jobName(h.job_type))}</td><td class="num">${fmtAgo(h.started_at)}</td>
      <td>${stateBadge(h.status)}</td><td class="num">${dur}</td>
      <td class="num">${h.processed??'–'}</td><td class="num">${h.recovered??0}</td></tr>`; };
  return `<h2 class="sec">Jobs</h2><div class="tablewrap"><table>
    <thead><tr><th>Job</th><th>Status</th><th>Progress</th><th class="num">Processed</th><th class="num">Changed</th><th class="num">Recovered</th></tr></thead>
    <tbody>${(d.jobs||[]).map(row).join('')}</tbody></table></div>
    <h2 class="sec">Run history</h2><div class="tablewrap"><table>
    <thead><tr><th>Job</th><th>Started</th><th>Status</th><th class="num">Duration</th><th class="num">Processed</th><th class="num">Recovered</th></tr></thead>
    <tbody>${(d.history||[]).map(hrow).join('')}</tbody></table></div>`;
}
/* ---------- providers ---------- */
const AVAIL_SEVERITY = {
  HEALTHY:'SUCCESS', RATE_LIMITED:'WARNING', DEGRADED:'WARNING',
  DAILY_LIMIT:'ERROR', UNAVAILABLE:'ERROR',
};
function providersHtml(d){
  const rl = d.rate_limit
    ? `<div class="banner DEGRADED" style="margin-bottom:10px">${badge('DEGRADED','DEGRADED')}` +
      `<span class="h">Provider rate limited</span><span class="cause">— ${esc(d.rate_limit.human)}` +
      ` · retry in <b class="num" data-retry-until="${Date.now()+d.rate_limit.retry_in_s*1000}">${fmtIn(d.rate_limit.retry_in_s)}</b>` +
      ` · <span class="muted">source: ${esc(d.rate_limit.retry_source||'backoff')}</span></span></div>`
    : '';
  const av = d.availability;
  let avail = '';
  if (av) {
    const sev = AVAIL_SEVERITY[av.state] || 'INFO';
    const usage = (av.daily_usage && av.daily_usage.percent_used != null)
      ? `${av.daily_usage.percent_used}%` : 'unknown';
    avail = `<div class="panel" data-testid="torbox-availability">`
      + `<h3>TorBox availability ${badge(av.state, sev)}</h3>`
      + `<div class="muted" style="margin-bottom:6px">`
      + (av.blocked
          ? `cooldown active — recovery in <b class="num" data-retry-until="${Date.now()+av.retry_in_s*1000}">${fmtIn(av.retry_in_s)}</b>`
          : `no cooldown active`)
      + (av.error_code ? ` · code ${esc(av.error_code)}` : '')
      + (av.reason && av.blocked ? ` · ${esc(av.reason)}` : '')
      + `</div>`
      + `<div class="grid kpis">`
      + kpi('Last success', av.last_success_at ? fmtAgo(av.last_success_at) : 'unknown')
      + kpi('Last 429', av.last_429_at ? fmtAgo(av.last_429_at) : '–')
      + kpi('Blackout since', av.blackout_started_at ? fmtAgo(av.blackout_started_at) : '–')
      + kpi('Daily usage', usage, '', 'not estimated')
      + kpi('429 events', (av.metrics||{}).rate_limit_events??0)
      + kpi('Requests blocked', (av.metrics||{}).requests_blocked??0, '', 'deferred, zero HTTP')
      + kpi('Probes', (av.metrics||{}).probes??0)
      + kpi('Recoveries', (av.metrics||{}).recoveries??0, 'ok')
      + `</div></div>`;
  }
  const circuit = d.circuit ? Object.entries(d.circuit.scrapers||{}).map(([name, sc])=>
    `<div class="panel"><h3>circuit · ${esc(name)} ${badge(sc.state, sc.state==='HEALTHY'?'SUCCESS':'WARNING')}</h3>
      <div class="grid kpis" style="margin-top:6px">
      ${kpi('Retry in', sc.retry_in_s?fmtIn(sc.retry_in_s):'–')}
      ${kpi('Consecutive fails', sc.consecutive_failures, sc.consecutive_failures?'warn':'')}
      ${kpi('Retry source', sc.retry_source||'–')}
      ${kpi('Half-open probe', sc.half_open_probe?'armed':'no')}
      </div>
      ${sc.last_error?`<div class="muted mono" style="margin-top:6px">${esc(sc.last_error)}</div>`:''}
    </div>`).join('')
    + `<div class="panel"><h3>Circuit metrics</h3><div class="grid kpis" style="margin-top:6px">
      ${kpi('429 events', (d.circuit.metrics||{}).rate_limit_events??0)}
      ${kpi('Backend errors', (d.circuit.metrics||{}).backend_error_events??0)}
      ${kpi('Circuit opened', (d.circuit.metrics||{}).circuit_opened??0)}
      ${kpi('Recovered', (d.circuit.metrics||{}).circuit_recovered??0,'ok')}
      ${kpi('Deferred requests', (d.circuit.metrics||{}).requests_deferred??0)}
      ${kpi('Half-open probes', (d.circuit.metrics||{}).half_open_probes??0)}
      </div></div>`
    : '';
  return avail + rl + d.providers.map(p=>`
    <div class="panel"><h3>${esc(p.name)} ${badge(p.status,p.status==='HEALTHY'?'SUCCESS':'WARNING')} <span class="muted">· window ${esc(p.window||'24h')}</span></h3>
    <div class="grid kpis" style="margin-top:6px">
      ${kpi('Retries',p.retries)}${kpi('HTTP 400',p.provider_400)}${kpi('HTTP 429',p.provider_429)}
      ${kpi('HTTP 5xx',p.provider_5xx)}${kpi('Not ready',p.not_ready)}
      ${kpi('Transient',p.transient)}${kpi('Permanent',p.permanent)}
      ${kpi('Add budget avg',p.avg_adds_per_resolve??NA,'',`limit ${p.budget_limit}`)}
    </div></div>`).join('') + circuit;
}
/* ---------- ingest ---------- */
const INGEST_STATE = {
  HEALTHY:['HEALTHY','SUCCESS','Ingest pipeline healthy'],
  RATE_LIMITED:['RATE_LIMITED','WARNING','Provider rate limited — queue safely paused'],
  DEGRADED:['DEGRADED','DEGRADED','Provider unavailable for a prolonged period — queue paused, retrying automatically'],
  IDLE:['IDLE','INFO','Queue empty — nothing wanted right now'],
  PENDING:['PENDING','RUNNING','Jobs waiting for the worker'],
};
function ingestHtml(d){
  if (!d.enabled) return empty('Ingest bridge disabled','Set INGEST_ENABLED=true to activate the arr → resolver wanted-queue.');
  const st = INGEST_STATE[d.state] || ['UNKNOWN','INFO',d.human||''];
  const prov = d.provider||{};
  const banner = `<div class="banner ${st[1]==='SUCCESS'?'HEALTHY':st[1]==='INFO'?'':st[1]}" aria-live="polite">`
    + `${badge(st[0], st[1]==='SUCCESS'?'SUCCESS':st[1])}<span class="h">${esc(st[2])}</span>`
    + (prov.blocked && prov.blocked.length
        ? `<span class="cause">— ${esc(prov.blocked.join(', '))} rate limited · retry in <b class="num">${fmtIn(prov.retry_in_s||0)}</b> — <b>geen false NO_SOURCE</b>: jobs blijven bewaard en gaan automatisch verder</span>`
        : '')
    + `</div>`;
  const counts = d.counts_by_state||{};
  const order = ['QUEUED','IDENTITY_VERIFYING','REGISTERING','RESOLVING','PROVIDER_WAIT','READY','DELIVERING','PLEX_REFRESH','COMPLETED','BLOCKED_IDENTITY','BLOCKED_NO_SOURCE','BLOCKED_MAPPING','FAILED_RETRYABLE','FAILED_FINAL'];
  const m = d.metrics||{};
  const kpis = kpi('Queue active', d.queue_active??0, d.queue_active?'run':'', 'non-terminal jobs')
    + kpi('Completed', m.completed??0,'ok', m.last_completed?`last: ${esc(m.last_completed)}`:'')
    + kpi('Provider waits', m.provider_waits??0, m.provider_waits?'warn':'', 'deferred, not failed')
    + kpi('Enqueued', m.enqueued??0,'', 'total');
  const countsRow = `<div class="bar" style="margin:8px 0">${order.filter(s=>counts[s]).map(s=>
    `<span>${esc(s.replace(/_/g,' '))} <b>${counts[s]}</b></span>`).join('') || '<span>queue empty</span>'}</div>`;
  const arrCard = side=>{
    const c = d[side]||{};
    const ok = c.arr_health_ok;
    const errs = (c.arr_health||[]).filter(h=>h.type==='error'||h.type==='unreachable');
    return card(`${side[0].toUpperCase()+side.slice(1)} bridge`,
      `<div>${badge(c.enabled?(ok!==false?'HEALTHY':'DEGRADED'):'OFF', !c.enabled?'WARNING':(ok!==false?'SUCCESS':'FAILED'))}
        <span class="muted" style="margin-left:6px">${esc(c.url||'')}</span></div>`
      + (c.last_rss_sync?`<div class="muted">last RSS sync: ${esc(String(c.last_rss_sync).slice(0,16).replace('T',' '))} UTC</div>`:'')
      + (errs.length?`<div class="muted" style="color:var(--warning)">${errs.map(e=>esc((e.message||'').slice(0,90))).join(' · ')}</div>`:''),
      badge(c.enabled?'ON':'OFF', c.enabled?'TV':'neutral'));
  };
  const recent = `<div class="panel"><h3>Catch-up policy</h3>
    <div class="muted">batch size <b class="num">${d.batch_size??1}</b> · reconcile every <b class="num">${Math.round((d.reconcile_interval_s||1200)/60)} min</b>
    ${d.last_reconcile_at?` · last reconcile ${fmtAgo(d.last_reconcile_at)}`:''}</div>
    <div class="muted" style="margin-top:4px">Provider 429 → queue pause + Retry-After/backoff. True no-match only after a normally completed search with zero usable candidates.</div></div>`;
  return banner + `<div class="grid kpis">${kpis}</div>${countsRow}
    <div class="grid cols" style="margin-top:var(--sp-3)">${arrCard('sonarr')}${arrCard('radarr')}</div>${recent}`;
}
/* ---------- item detail ---------- */
async function openItem(id){
  try{
    const t = await api(`/ops-media/${id}/trace`);
    const i = t.item;
    const ready = i.status === 'READY';
    const id8 = id.slice(0,8);
    const acts = ready
      ? `<button class="act" onclick="runAction(event,'${id}','recheck',null,'#idact-${id8}')">Recheck source</button>
         <button class="act" onclick="runAction(event,'${id}','find-alternative',null,'#idact-${id8}')">Find alternative</button>
         <button class="act danger" onclick="askMarkBad('${id}','#idact-${id8}')">Mark source bad</button>`
      : `<button class="act primary" onclick="runAction(event,'${id}','search',null,'#idact-${id8}')">Search now</button>
         <button class="act" onclick="runAction(event,'${id}','retry',null,'#idact-${id8}')">Retry now</button>
         <button class="act" onclick="askMagnet('${id}','#idact-${id8}')">Add magnet</button>`;
    const steps = [
      {l:'Plex mapping', v:i.plex_path, ok:!!i.plex_path},
      {l:'Resolver item', v:`${i.id.slice(0,8)} (gen ${i.generation})`, ok:true},
      {l:'Current source', v:t.active_source?`${t.active_source.file_name} · ${(t.active_source.size/2**30).toFixed(2)} GB`:'none', ok:!!t.active_source},
    ];
    const matrix = `
      <tr><td>Identity</td><td>${i.kind==='episode' ? (i.show_imdb_id?badge('Healthy','SUCCESS'):badge('Incomplete','WARNING')) : badge('Healthy','SUCCESS')}</td></tr>
      <tr><td>Source</td><td>${t.active_source?badge('Active','SUCCESS'):badge(i.status==='NO_SOURCE'?'No usable':'None', i.status==='NO_SOURCE'?'NO_SOURCE':'WARNING')}</td></tr>
      <tr><td>Path</td><td>${i.plex_path?badge('Configured','SUCCESS'):badge('Missing','FAILED')}</td></tr>
      <tr><td>Delivery</td><td>${badge('Not active','neutral')}</td></tr>`;
    const head = i.series
      ? `${esc(i.series)} <span class="muted">${esc(`S${String(i.season).padStart(2,'0')}E${String(i.episode).padStart(2,'0')}`)}</span> · ${esc(i.title||'')}`
      : `${esc(i.title||'')}${i.year?` <span class="muted">${i.year}</span>`:''}`;
    $('#itembody').innerHTML = `
      <h3 style="margin:0 0 6px;font-size:15px">${head} ${badge(i.status)} <span class="muted">gen ${i.generation}</span></h3>
      <div style="margin:8px 0">${acts}</div><div id="idact-${id8}"></div>
      <div class="grid cols">
        <div class="panel"><h3>Health matrix</h3><table class="matrix">${matrix}</table></div>
        <div class="panel"><h3>Path chain</h3><div class="chain">${steps.map(s=>
          `<span class="step ${s.ok?'ok':'bad'}">${s.ok?'✓':'✗'} ${s.l}: ${esc(s.v)}</span><span class="arrow">↓</span>`).join('')}
          <span class="step">provider (TorBox)</span></div>
          ${i.kind==='episode'?`<div class="muted" style="margin-top:6px">show <span class="mono">${esc(i.show_imdb_id||'–')}</span> · episode <span class="mono">${esc(i.imdb_id||'–')}</span></div>`:`<div class="muted" style="margin-top:6px">imdb <span class="mono">${esc(i.imdb_id||'–')}</span></div>`}</div>
      </div>
      <h2 class="sec">Candidate trace — last resolve</h2>
      ${t.last_resolve.candidate_count!=null?`<div class="muted">${t.last_resolve.candidate_count} candidates · ${t.last_resolve.provider_adds??0} provider adds</div>${rejectBar(t.last_resolve.rejects||{})}`:''}
      <div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Candidate</th><th>Outcome</th></tr></thead><tbody>
      ${t.last_resolve.candidates.map((c,n)=>`<tr><td class="num">${n+1}</td><td class="mono" style="max-width:420px;overflow:hidden;text-overflow:ellipsis">${esc(c.name||c.hash||'?')}</td>
        <td>${c.result==='SELECTED'?badge('SELECTED','SUCCESS'):`<span class="muted">${esc(c.human||c.result)}</span>${c.error?`<div class="muted">${esc(c.error)}</div>`:''}`}</td></tr>`).join('')}</tbody></table></div>
      <details style="margin-top:10px"><summary>Technical timeline</summary><div class="chain">${t.timeline.slice(-25).reverse().map(e=>
        `<span class="step">${new Date(e.ts*1000).toLocaleTimeString()} · ${esc(e.kind)}</span>`).join('')}</div></details>`;
    $('#itemdlg').style.display='block';
  }catch(e){ failures++; setLive(false); }
}
function closeItem(){ $('#itemdlg').style.display='none'; }
function setLive(on){
  $('#livedot').className = 'st-dot' + (on?'':' warn');
  if (on && !staleTick) $('#livetext').textContent = 'Live';
}
function refresh(sec){
  if(sec==='overview') apiKeep('/ops/dashboard', d=>{
    const h = overviewHtml(d);
    paintInto('#healthbanner','hb',h.status); paintInto('#healthcluster','hh',h.health);
    paintInto('#statstrip','st',h.strip); paintInto('#nowactive','na',h.active);
    paintInto('#wins','wi',h.wins); paintInto('#diagnostics','dg',h.diag);
    const P = d.physical||{};
    $('#sb-phys').className = 'st-dot' + (P.status==='HEALTHY'?'':P.status==='FAILED'?' err':' warn');
    $('#sb-phystxt').textContent = P.status||'–';
  });
  if(sec==='issues') apiKeep('/ops/issues', d=>{
    paintInto('#issues','iss', issuesHtml(d));
    $('#nav-issues').textContent = d.total || '';
  });
  if(sec==='jobs') apiKeep('/ops/jobs', d=>paintInto('#jobs','jobs', jobsHtml(d)));
  if(sec==='providers') apiKeep('/ops/providers/health', d=>paintInto('#providers','prov', providersHtml(d)));
  if(sec==='ingest') apiKeep('/ops/ingest/health', d=>{
    paintInto('#ingest','ingest', ingestHtml(d));
    const c = d.counts_by_state||{};
    const active = (c.QUEUED||0)+(c.RESOLVING||0)+(c.PROVIDER_WAIT||0)+(c.DELIVERING||0);
    $('#nav-ingest').textContent = active || '';
  });
  if(sec==='library') loadLibrary();
}
const cadence = {overview:5000, issues:8000, activity:15000, jobs:5000, providers:30000, library:30000, ingest:8000};
const lastPoll = {};
function loop(sec){
  const now = Date.now();
  if (now - (lastPoll[sec]||0) < cadence[sec]) return;
  lastPoll[sec] = now; refresh(sec);
}
function onShown(sec){
  lastPoll[sec]=0; loop(sec);
  const titles = {overview:['Overview','system health at a glance'],activity:['Activity','event timeline'],
    issues:['Issues','triage queue'],library:['Library','all managed items'],
    ingest:['Ingest','sonarr/radarr wanted → library pipeline'],
    jobs:['Jobs','background operations'],providers:['Providers','debrid provider health']};
  $('#pagetitle').textContent = titles[sec][0];
  $('#pagesub').textContent = titles[sec][1];
}
function loadActivity(){
  apiKeep(`/ops/activity?hours=${$('#acthours').value}&filter=${actFilter}&limit=15&offset=${actPage*15}`,
    d=>{ $('#actpage').textContent = `${actPage*15+1}–${Math.min((actPage+1)*15,d.total)} of ${d.total}`;
         paintInto('#activity','act', activityHtml(d)); });
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#s-'+b.dataset.s).classList.add('on');
  history.replaceState(null, '', '#'+b.dataset.s);
  onShown(b.dataset.s);
});
document.querySelectorAll('#actfilters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#actfilters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); actFilter=b.dataset.f; actPage=0;
  history.replaceState(null, '', `#activity/${actFilter}`);
  loadActivity();
});
$('#acthours').onchange = ()=>{ actPage=0; loadActivity(); };
$('#actprev').onclick = ()=>{ if(actPage>0){actPage--;loadActivity();} };
$('#actnext').onclick = ()=>{ actPage++; loadActivity(); };
$('#libq').oninput = renderLibrary; $('#libstatus').onchange = renderLibrary;
/* health-cluster metrics zijn klikbaar en sturen je naar de juiste sectie */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav]');
  if (!t) return;
  const [sec, filter] = t.dataset.nav.split(':');
  if (sec === 'library' && filter){
    const sel = $('#libstatus');
    if ([...sel.options].some(o=>o.value===filter || o.text===filter)) sel.value = filter;
  }
  const btn = document.querySelector(`#nav button[data-s="${sec}"]`);
  if (btn) btn.click();
});
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden) for (const s of ['overview','issues','jobs','activity','library']) lastPoll[s]=0;
});
/* live elapsed-tickers: [data-elapsed] bevat epoch-start; ticks zonder refetch */
setInterval(()=>{
  if (document.hidden) return;
  const now = Date.now()/1000;
  document.querySelectorAll('[data-elapsed]').forEach(el=>{
    const st = parseFloat(el.dataset.elapsed);
    if (Number.isFinite(st))
      el.textContent = fmtDur(Math.max(0, now - st)) + (el.dataset.suffix ? ' ' + el.dataset.suffix : '');
  });
}, 1000);
setInterval(()=>{
  if (document.hidden) return;
  const sec = document.querySelector('section.on').id.replace('s-','');
  loop(sec);
  if (sec==='overview'){ loop('issues'); loop('jobs'); loop('ingest'); }
  if (sec==='activity') loop('activity');
}, 2000);
function applyHash(){
  const h = location.hash.replace('#','');
  if (h.startsWith('item/')){ openItem(h.slice(5)); return; }
  if (h.startsWith('activity/')){
    document.querySelector('#nav button[data-s="activity"]').click();
    const fb = document.querySelector(`#actfilters button[data-f="${h.split('/')[1]}"]`);
    if (fb) fb.click();
    return;
  }
  const b = document.querySelector(`#nav button[data-s="${h}"]`);
  if (b) b.click();
}
onShown('overview'); loadLibrary();
applyHash();
</script>
</body>
</html>
